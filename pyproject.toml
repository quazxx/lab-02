[project]
name = "streamstats"
version = "0.1.0"
description = "Потоковый анализатор журналов CSV и JSONL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4.0",
]

[project.scripts]
streamstats = "streamstats.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP028"]

[tool.ruff.lint.isort]
known-first-party = ["streamstats"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["streamstats"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true